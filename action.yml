name: ectoplasm
description: Разбор сессий ИИ-агентов - какой недоверенный текст привёл к опасному действию. Находки уходят в SARIF для вкладки Security.
inputs:
  sessions:
    description: Путь к журналу сессии (.jsonl), который сохранили как артефакт или положили в репозиторий
    required: true
  min-confidence:
    description: weak, medium или strong
    default: medium
  sarif:
    description: Куда записать SARIF
    default: ectoplasm.sarif
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: |
        ectoplasm trace "${{ inputs.sessions }}" --min-confidence "${{ inputs.min-confidence }}" --sarif "${{ inputs.sarif }}" --no-color || true
